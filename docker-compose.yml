services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-judge-secret-development-key}
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/serviceAccountKey.json
      - SANDBOX_IMAGE=reinforce-ml-sandbox:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/serviceAccountKey.json:/app/serviceAccountKey.json:ro
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
